<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loan EMI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:800px">
  <h2 class="mb-4">Loan EMI Calculator</h2>
  <form id="emiForm" class="card card-body mb-3" novalidate>
    <div class="mb-2"><label class="form-label">Loan amount (P)</label>
      <input id="principal" type="number" class="form-control" min="1" step="any" required></div>
    <div class="mb-2"><label class="form-label">Annual interest rate (%)</label>
      <input id="rate" type="number" class="form-control" min="0.01" step="any" required></div>
    <div class="mb-3"><label class="form-label">Tenure (months)</label>
      <input id="months" type="number" class="form-control" min="1" step="1" required></div>
    <button class="btn btn-primary" type="submit">Calculate</button>
    <div id="err" class="text-danger mt-2"></div>
  </form>

  <div id="result" class="card card-body mb-3" style="display:none">
    <h5>Result</h5>
    <div>Monthly EMI: <b id="rEmi"></b></div>
    <div>Total payment: <b id="rTotal"></b></div>
    <div>Total interest: <b id="rInt"></b></div>
    <div class="text-muted small mt-2">Served by pod <b id="rPod"></b> (<span id="rIp"></span>)</div>
  </div>

  <h5>Last 10 calculations</h5>
  <table class="table table-sm table-striped">
    <thead><tr><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th><th>Time</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
  <footer class="text-muted small mt-4">EMI Calculator v1.0 - DS-584 Assignment 4</footer>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="app.js"></script>
</body>
</html>
