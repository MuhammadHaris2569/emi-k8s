apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:6.0
          command:
            - sh
            - -c
            - |
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --host $h --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
                  echo "waiting for $h"; sleep 3
                done
              done
              mongosh --host mongo-0.mongo --quiet --eval '
                rs.initiate({_id:"rs0", members:[
                  {_id:0, host:"mongo-0.mongo:27017"},
                  {_id:1, host:"mongo-1.mongo:27017"},
                  {_id:2, host:"mongo-2.mongo:27017"}]})'
              sleep 15
              mongosh --host mongo-0.mongo --quiet --eval '
                rs.status().members.forEach(m => print(m.name + "  " + m.stateStr))'
